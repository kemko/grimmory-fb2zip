name: Check patched Grimmory

on:
  pull_request:
  push:
  workflow_call:
    inputs:
      upstream_tag:
        type: string
        default: ''
      upstream_sha:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMPOSE_PROJECT_NAME: fb2zip-check-${{ github.run_id }}-${{ github.run_attempt }}
      SMOKE_IMAGE: grimmory-fb2zip:check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check preparation and workflow helpers
        run: |
          python3 -m unittest discover -s tests -v
          bash -n scripts/prepare-upstream.sh
      - name: Prepare verified upstream and read tool versions
        id: upstream
        env:
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
          UPSTREAM_SHA: ${{ inputs.upstream_sha }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess
          manifest = json.loads(pathlib.Path('upstream.json').read_text())
          tag = os.environ['UPSTREAM_TAG'] or manifest['base_tag']
          sha = os.environ['UPSTREAM_SHA'] or manifest['base_sha']
          subprocess.run(['bash', 'scripts/prepare-upstream.sh', tag, '.work/upstream', sha], check=True)
          java = re.search(r'JavaLanguageVersion\.of\((\d+)\)', pathlib.Path('.work/upstream/backend/build.gradle.kts').read_text()).group(1)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'java={java}\ntag={tag}\nsha={sha}\n')
          PY
      - uses: taiki-e/install-action@5bf6ce016fd2e72eefc647cbca1e4213f65955b8 # v2.87.5
        with:
          tool: just,actionlint
      - name: Validate workflows
        run: actionlint
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: ${{ steps.upstream.outputs.java }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: .work/upstream/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .work/upstream/.nvmrc
      - name: Install libarchive
        run: |
          sudo apt-get update
          sudo apt-get install --yes libarchive-dev
          sudo mkdir -p /usr/java/packages/lib
          sudo cp /usr/lib/x86_64-linux-gnu/libarchive.* /usr/java/packages/lib/
      - name: Check application and audit dependencies
        working-directory: .work/upstream
        run: |
          just ui install-ci
          just check
          just ui audit-ci
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build patched runtime image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .work/upstream
          file: .work/upstream/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.SMOKE_IMAGE }}
          build-args: |
            APP_VERSION=${{ steps.upstream.outputs.tag }}-fb2zip-check
            APP_REVISION=${{ steps.upstream.outputs.sha }}
      - name: Start disposable application and test real uploads
        shell: bash
        run: |
          docker compose -f tests/smoke-compose.yml up -d --wait --wait-timeout 240
          address=$(docker compose -f tests/smoke-compose.yml port grimmory 6060)
          mkdir -p .work/reports
          python3 tests/smoke.py "http://$address" | tee .work/reports/smoke-results.log
      - name: Collect runtime logs
        if: always()
        run: |
          mkdir -p .work/reports
          docker compose -f tests/smoke-compose.yml logs --no-color > .work/reports/smoke.log 2>&1
      - name: Remove disposable resources
        if: always()
        run: docker compose -f tests/smoke-compose.yml down --volumes --remove-orphans
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          include-hidden-files: true
          name: check-${{ inputs.upstream_tag || 'baseline' }}-${{ github.run_attempt }}
          path: |
            .work/reports/
            .work/upstream/backend/build/reports/
            .work/upstream/backend/build/test-results/
            .work/upstream/frontend/test-results/
