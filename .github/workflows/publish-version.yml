name: Check and publish one version

on:
  workflow_call:
    inputs:
      upstream_tag:
        required: true
        type: string
      upstream_sha:
        required: true
        type: string
      dry_run:
        required: true
        type: boolean
      bootstrap_package:
        type: boolean
        default: false

# Hold the lock across tests, source publication and image push.
concurrency:
  group: fb2zip-${{ inputs.upstream_tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/check.yml
    with:
      upstream_tag: ${{ inputs.upstream_tag }}
      upstream_sha: ${{ inputs.upstream_sha }}
  publish:
    needs: check
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      BOOTSTRAP_PACKAGE: ${{ inputs.bootstrap_package }}
      UPSTREAM_TAG: ${{ inputs.upstream_tag }}
      UPSTREAM_SHA: ${{ inputs.upstream_sha }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install registry client
        run: sudo apt-get update && sudo apt-get install --yes skopeo
      - name: Prepare exact tested source
        run: bash scripts/prepare-upstream.sh "$UPSTREAM_TAG" .work/upstream "$UPSTREAM_SHA"
      - name: Check immutable image identity again under the version lock
        id: state
        run: python3 scripts/pending-tags.py state --tag "$UPSTREAM_TAG" --sha "$UPSTREAM_SHA"
      - name: Archive patched source before image publication
        id: source
        shell: bash
        run: |
          publish=()
          if [[ "$DRY_RUN" == 'false' ]]; then publish=(--publish); fi
          python3 scripts/pending-tags.py source --tag "$UPSTREAM_TAG" --sha "$UPSTREAM_SHA" "${publish[@]}"
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        if: inputs.dry_run || steps.state.outputs.present != 'true'
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        if: inputs.dry_run || steps.state.outputs.present != 'true'
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: '!inputs.dry_run && steps.state.outputs.present != ''true'''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build both architectures from patched path context
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        if: inputs.dry_run || steps.state.outputs.present != 'true'
        with:
          context: .work/upstream
          file: .work/upstream/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ !inputs.dry_run }}
          tags: ${{ steps.state.outputs.image }}:${{ steps.state.outputs.image_tag }}
          build-args: |
            APP_VERSION=${{ steps.state.outputs.image_tag }}
            APP_REVISION=${{ inputs.upstream_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.patch_commit }}
            org.opencontainers.image.version=${{ steps.state.outputs.image_tag }}
            io.grimmory.fb2zip.upstream_repository=https://github.com/grimmory-tools/grimmory
            io.grimmory.fb2zip.upstream_sha=${{ inputs.upstream_sha }}
            io.grimmory.fb2zip.series_sha256=${{ steps.state.outputs.series_sha256 }}
      - name: Record published registry digest
        if: '!inputs.dry_run'
        run: python3 scripts/pending-tags.py finalize --tag "$UPSTREAM_TAG" --sha "$UPSTREAM_SHA" --publish
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          include-hidden-files: true
          name: source-${{ inputs.upstream_tag }}-${{ github.run_attempt }}
          path: .work/release/
